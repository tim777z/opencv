name: SBOM Generation

# Software Bill of Materials generation for supply chain transparency.
# Produces SPDX and CycloneDX SBOMs for the container image and the
# Python tooling dependencies. Artifacts are uploaded for each run and
# attached to releases when tagged.

on:
  push:
    branches: [master, main]
    tags: ['v*', 'perf*']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 0'  # Weekly on Sunday 02:00 UTC

permissions:
  contents: read
  packages: read
  id-token: write  # For OIDC token to sign attestations (future)

jobs:
  sbom-container:
    name: Container Image SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      sbom-path: ${{ steps.syft.outputs.sbom-path }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build container image (toolchain stage only for speed)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: toolchain
          load: true
          tags: opencv-dev:sbom
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate SBOM with Syft
        id: syft
        uses: anchore/sbom-action@v0
        with:
          image: opencv-dev:sbom
          format: spdx-json,cyclonedx-json
          output-file: sbom-container.spdx.json

      - name: Upload SBOM as artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-container
          path: |
            sbom-container.spdx.json
            sbom-container.cyclonedx.json
          retention-days: 90

      # Release asset publication is handled by .github/workflows/release.yml,
      # which creates the GitHub Release and uploads artifacts atomically.
  sbom-python:
    name: Python Dependencies SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install cyclonedx-bom

      - name: Generate CycloneDX SBOM for Python deps
        run: |
          cyclonedx-py -o sbom-python.cyclonedx.json --format json

      - name: Upload SBOM as artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-python
          path: sbom-python.cyclonedx.json
          retention-days: 90

      # Release asset publication is handled by .github/workflows/release.yml.
  # SLSA provenance/attestation can be added as a separate job-level reusable
  # workflow with correctly computed artifact subjects. The prior step-level
  # reusable-workflow invocation was structurally invalid for GitHub Actions.