# CodeQL configuration for OpenCV C/C++ codebase
#
# Focuses analysis on security and quality findings in first-party code while
# excluding vendored third-party sources and generated/build artifacts.
# Keep this file conservative: overly broad or invalid query/config combinations
# cause CodeQL startup failures and provide no security value.

name: "OpenCV CodeQL Config"

queries:
  - uses: security-and-quality

paths-ignore:
  - "3rdparty/**"
  - "build*/**"
  - "**/test/**"
  - "**/perf/**"
  - "**/samples/**"
  - "modules/*/gen/**"
  - "platforms/**"
